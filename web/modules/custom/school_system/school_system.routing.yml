# API REST Endpoints

# Students
school_system.api.students:
  path: '/api/students'
  defaults:
    _controller: '\Drupal\school_system\Controller\StudentApiController::getAll'
  methods: [GET]
  requirements:
    _permission: 'access content'

school_system.api.student:
  path: '/api/students/{id}'
  defaults:
    _controller: '\Drupal\school_system\Controller\StudentApiController::getOne'
  methods: [GET]
  requirements:
    _permission: 'access content'

school_system.api.student.create:
  path: '/api/students'
  defaults:
    _controller: '\Drupal\school_system\Controller\StudentApiController::createStudent'
  methods: [POST]
  requirements:
    _permission: 'create student content'

school_system.api.student.update:
  path: '/api/students/{id}'
  defaults:
    _controller: '\Drupal\school_system\Controller\StudentApiController::update'
  methods: [PATCH]
  requirements:
    _permission: 'edit any student content'

school_system.api.student.delete:
  path: '/api/students/{id}'
  defaults:
    _controller: '\Drupal\school_system\Controller\StudentApiController::delete'
  methods: [DELETE]
  requirements:
    _permission: 'delete any student content'

