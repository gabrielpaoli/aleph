# Authentication
school_system.api.auth.login:
  path: '/api/auth/login'
  defaults:
    _controller: '\Drupal\school_system\Controller\AuthApiController::login'
  methods: [POST]
  requirements:
    _access: 'TRUE'

school_system.api.auth.logout:
  path: '/api/auth/logout'
  defaults:
    _controller: '\Drupal\school_system\Controller\AuthApiController::logout'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'

school_system.api.auth.me:
  path: '/api/auth/me'
  defaults:
    _controller: '\Drupal\school_system\Controller\AuthApiController::getCurrentUser'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
